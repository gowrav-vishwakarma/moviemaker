[project]
name = "moviemaker"
version = "0.1.0"
description = "Extensible AI movie maker that orchestrates Wan2GP for video and image generation."
readme = "README.md"
authors = [
    { name = "Gowrav Vishwakarma", email = "gowravvishwakarma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.0",
    "ffmpeg-python>=0.2.0",
    "nicegui>=2.22.0",
    "pillow>=11.0.0",
    "pydantic>=2.11.0",
    "yt-dlp>=2025.1.0",
]

[project.scripts]
moviemaker = "moviemaker.main:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
